{% extends "_base.html" %}
{% block title %}Login — Telco Partner Skills{% endblock %}
{% block content %}
<div style="max-width:360px;margin:4rem auto">
  <h1 style="margin-bottom:1.5rem">Sign in</h1>
  {% if error %}
  <p class="warn" style="margin-bottom:1rem">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login">
    <div class="field" style="margin-bottom:1rem">
      <label class="label">Password</label>
      <input type="password" name="secret" autofocus autocomplete="current-password"
             style="width:100%;box-sizing:border-box">
    </div>
    <button type="submit" class="btn">Sign in</button>
  </form>
</div>
{% endblock %}
